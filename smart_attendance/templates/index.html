<!DOCTYPE html>
<html>
<head>
    <title>Smart Attendance</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">
        <h2>Smart Attendance System</h2>

        <form action="/add" method="POST">
            <input class="form-control mb-2" type="text" name="name" placeholder="Name">
            <input class="form-control mb-2" type="text" name="roll" placeholder="Roll">
            <input class="form-control mb-2" type="number" name="attendance" placeholder="Attendance">

            <button class="btn btn-primary">Add Student</button>
        </form>
    </div>

</body>

</html>
